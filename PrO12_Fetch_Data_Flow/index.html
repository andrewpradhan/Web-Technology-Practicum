<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Fetch Data</title>
<style>body{font-family:Arial;max-width:800px;margin:20px auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #94a3b8;padding:7px;text-align:left}th{background:#dbeafe}.Approved{color:#15803d}.Pending{color:#b45309}.Rejected{color:#b91c1c}#st{margin:8px 0;color:#475569}</style></head><body>
<h2>Leave Requests (fetched from JSON endpoint)</h2><label>Filter by status: <select id="f"><option value="">All</option><option>Approved</option><option>Pending</option><option>Rejected</option></select></label><div id="st">Loading…</div>
<table><thead><tr><th>ID</th><th>Name</th><th>Dept</th><th>Type</th><th>From</th><th>To</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table><script>
let data=[];const tb=document.getElementById('tb'),st=document.getElementById('st');
function draw(s){tb.innerHTML='';data.filter(d=>!s||d.status===s).forEach(d=>{const r=tb.insertRow();[d.id,d.name,d.dept,d.type,d.from,d.to].forEach(v=>r.insertCell().textContent=v);const c=r.insertCell();c.textContent=d.status;c.className=d.status});st.textContent=tb.rows.length+' record(s) shown';}
fetch('data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(j=>{data=j;draw('')}).catch(e=>st.textContent='Error: '+e.message);
document.getElementById('f').onchange=e=>draw(e.target.value);
</script></body></html>
