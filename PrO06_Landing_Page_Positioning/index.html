<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Landing</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:Arial}
.hero{position:relative;height:100vh;min-height:520px;background:#e2e8f0;overflow:hidden}
.q{position:absolute;padding:14px;font-weight:bold;color:#fff}
.tl{top:0;left:0;width:50%;height:50%;background:#2563eb}.tr{top:0;right:0;width:50%;height:50%;background:#16a34a}
.bl{bottom:0;left:0;width:50%;height:50%;background:#d97706}.br{bottom:0;right:0;width:50%;height:50%;background:#9333ea}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:28px 36px;border-radius:12px;text-align:center;box-shadow:0 8px 30px #0005;z-index:2}
.badge{position:relative;top:-6px;left:6px;background:#dc2626;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.fixed{position:fixed;right:12px;bottom:12px;background:#0f172a;color:#fff;padding:8px 14px;border-radius:20px;z-index:3;font-size:14px}
@media(max-width:600px){.center{padding:16px 18px;width:80%}}</style></head><body><div class="hero">
<div class="q tl">Apply Leave</div><div class="q tr">Track Status</div><div class="q bl">Policies</div><div class="q br">Reports</div>
<div class="center"><h1>Employee Leave Portal <span class="badge">NEW</span></h1><p>Request, track and approve leave in one place.</p></div>
<div class="fixed">Need help? Contact HR</div></div></body></html>
