<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Dark Mode</title>
<style>:root{--bg:#f8fafc;--fg:#0f172a;--card:#fff;--ac:#2563eb}[data-theme=dark]{--bg:#0f172a;--fg:#e2e8f0;--card:#1e293b;--ac:#38bdf8}
body{background:var(--bg);color:var(--fg);font-family:Arial;margin:0;transition:background .3s,color .3s}header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:var(--card)}
.card{background:var(--card);max-width:560px;margin:24px auto;padding:20px;border-radius:10px;box-shadow:0 2px 8px #0002}a{color:var(--ac)}
.sw{position:relative;width:56px;height:28px;background:#94a3b8;border-radius:28px;border:0;cursor:pointer;transition:background .3s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .3s}
[data-theme=dark] .sw{background:var(--ac)}[data-theme=dark] .sw::after{transform:translateX(28px)}</style></head><body>
<header><b>Employee Leave Portal</b><span>☀ <button class="sw" id="sw" aria-label="Toggle dark mode"></button> ☾</span></header>
<div class="card"><h2>Welcome, Andrew</h2><p>You have <b>9</b> casual leave days remaining. Your last request was <a href="#">approved</a>.</p></div><script>
const r=document.documentElement;let t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';r.dataset.theme=t;
document.getElementById('sw').onclick=()=>{t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}};</script></body></html>
