<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Quiz</title>
<style>body{font-family:Arial;background:#eef2ff}#q{max-width:520px;margin:30px auto;background:#fff;padding:22px;border-radius:10px}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:10px;border:1px solid #94a3b8;border-radius:6px;background:#fff;cursor:pointer;font-size:15px}.opt.right{background:#bbf7d0;border-color:#16a34a}.opt.wrong{background:#fecaca;border-color:#dc2626}#nx{display:none;margin-top:10px;padding:9px 18px}</style></head><body><div id="q"><div id="pg"></div><h3 id="qt"></h3><div id="op"></div><button id="nx">Next</button><h3 id="sc"></h3></div><script>
const Q=[{q:'Which tag creates a hyperlink?',o:['<a>','<link>','<href>'],a:0},{q:'Which CSS property sets text colour?',o:['font-color','color','text-style'],a:1},{q:'Which method selects an element by id?',o:['getElementById','queryAll','findId'],a:0},{q:'Which event fires on a button click?',o:['onhover','onclick','onpress'],a:1}];
let i=0,s=0;const $=id=>document.getElementById(id);
function show(){$('pg').textContent='Question '+(i+1)+' of '+Q.length;$('qt').textContent=Q[i].q;$('op').innerHTML='';$('nx').style.display='none';Q[i].o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.dataset.k=k;$('op').appendChild(b)})}
$('op').addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||$('op').dataset.done===i+'')return;$('op').dataset.done=i;const k=+b.dataset.k;if(k===Q[i].a){s++;b.classList.add('right')}else{b.classList.add('wrong');$('op').children[Q[i].a].classList.add('right')}$('nx').style.display='inline-block'});
$('nx').onclick=()=>{i++;if(i<Q.length)show();else{$('qt').textContent='Quiz complete!';$('op').innerHTML='';$('nx').style.display='none';$('pg').textContent='';$('sc').textContent='Score: '+s+' / '+Q.length}};show();</script></body></html>
