<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flex Nav + Grid Gallery</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f8fafc}
nav{display:flex;justify-content:space-between;align-items:center;background:#1e293b;padding:10px 20px;flex-wrap:wrap}nav ul{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{color:#e2e8f0;padding:8px 14px;text-decoration:none;border-radius:6px}nav a:hover,nav a:focus{background:#3b82f6;outline:none}nav .logo{color:#fff;font-weight:bold}
h1{text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;padding:16px;max-width:1000px;margin:auto}
.grid img{width:100%;height:150px;object-fit:cover;border-radius:8px;transition:transform .2s;cursor:zoom-in}.grid img:hover{transform:scale(1.04)}
.lb{display:none;position:fixed;inset:0;background:#000c;place-items:center;z-index:5}.lb:target{display:grid}.lb img{max-width:80%;max-height:80%}</style></head><body>
<nav><span class="logo">PhotoHub</span><ul><li><a href="#">Home</a></li><li><a href="#">Gallery</a></li><li><a href="#">About</a></li><li><a href="#">Contact</a></li></ul></nav>
<h1>Office Event Gallery</h1><div class="grid">
<a href="#i1"><img src="g1.png" alt="Event photo 1" loading="lazy"></a><a href="#i2"><img src="g2.png" alt="Event photo 2" loading="lazy"></a><a href="#i3"><img src="g3.png" alt="Event photo 3" loading="lazy"></a><a href="#i4"><img src="g4.png" alt="Event photo 4" loading="lazy"></a><a href="#i5"><img src="g5.png" alt="Event photo 5" loading="lazy"></a><a href="#i6"><img src="g6.png" alt="Event photo 6" loading="lazy"></a></div>
<a href="#" class="lb" id="i1"><img src="g1.png" alt="Event photo 1 enlarged"></a><a href="#" class="lb" id="i2"><img src="g2.png" alt="Event photo 2 enlarged"></a>
</body></html>
